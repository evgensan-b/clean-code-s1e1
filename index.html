<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css" media="screen">
  </head>
  <body class="page">
    <header class="header">
      <img class="header__image" src="./eisenhower-matrix.jpg" alt="The Eisenhower matrix">
      <a 
        class="header__link-more-info" 
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </header>
    <main class="todo-app">
      <section id="section-add" class="todo-app__section">
        <label class="todo-app__label" for="new-task">Add Item</label>
        <form class="todo-app__form">
          <input id="new-task" class="todo-app__input u-flex-grow" type="text">
          <button class="todo-app__button">Add</button>
        </form>
      </section>
      <section class="todo-app__section">
        <h1 class="todo-app__title">Todo</h1>
        <ul id="incomplete-tasks" class="todo-app__list">
          <li class="todo-app__list-item">
            <input class="todo-app__input" type="checkbox">
            <label class="todo-app__label u-flex-grow">Pay Bills</label>
            <input class="todo-app__input u-flex-grow" type="text">
            <button class="todo-app__button todo-app__button_edit">Edit</button>
            <button class="todo-app__button todo-app__button_delete">
              <img class="todo-app__image-delete" src="./remove.svg" alt="">
            </button>
          </li>
          <li class="todo-app__list-item list-item_edit-mode">
            <input class="todo-app__input" type="checkbox">
            <label class="todo-app__label u-flex-grow">Go Shopping</label>
            <input class="todo-app__input u-flex-grow" type="text" value="Go Shopping">
            <button class="todo-app__button todo-app__button_edit">Save</button>
            <button class="todo-app__button todo-app__button_delete">
              <img class="todo-app__image-delete" src="./remove.svg" alt="">
            </button>
          </li>
        </ul>
      </section>
      <section class="todo-app__section">
        <h2 class="todo-app__title">Completed</h2>
        <ul id="completed-tasks" class="todo-app__list">
          <li class="todo-app__list-item">
            <input class="todo-app__input" type="checkbox" checked>
            <label class="todo-app__label u-flex-grow">See the Doctor</label>
            <input class="todo-app__input u-flex-grow" type="text">
            <button class="todo-app__button todo-app__button_edit">Edit</button>
            <button class="todo-app__button todo-app__button_delete">
              <img class="todo-app__image-delete" src="./remove.svg" alt="">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
