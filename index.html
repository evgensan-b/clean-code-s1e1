<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="page">
    <header class="header">
      <img class="header-image" src="./eisenhower-matrix.jpg">
      <a 
        class="more-info-link" 
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </header>
    <main class="main">
      <section id="top-section">
        <label class="label" for="new-task">Add Item</label>
        <form class="task-row-wrapper">
          <input id="new-task" class="task input" type="text">
          <button class="button">Add</button>
        </form>
      </section>
      <section>
        <h1 class="section-title">Todo</h1>
        <ul class="task-list" id="incomplete-tasks">
          <li class="list-item">
            <input class="input" type="checkbox">
            <label class="task label">Pay Bills</label>
            <input type="text" class="task input">
            <button class="edit-task button">Edit</button>
            <button class="delete-task button">
              <img class="delete-task-image" src="./remove.svg">
            </button>
          </li>
          <li class="list-item edit-mode">
            <input class="input" type="checkbox">
            <label class="task label">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task input">
            <button class="edit-task button">Save</button>
            <button class="delete-task button">
              <img class="delete-task-image" src="./remove.svg">
            </button>
          </li>
        </ul>
      </section>
      <section>
        <h2 class="section-title">Completed</h2>
        <ul class="task-list" id="completed-tasks">
          <li class="list-item">
            <input class="input" type="checkbox" checked>
            <label class="task label">See the Doctor</label>
            <input type="text" class="task input">
            <button class="edit-task button">Edit</button>
            <button class="delete-task button">
              <img class="delete-task-image" src="./remove.svg">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
